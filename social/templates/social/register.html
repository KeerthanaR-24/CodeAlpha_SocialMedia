<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>

<body>

<h1>Create Account</h1>

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <br><br>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<a href="{% url 'login' %}">
    Already have an account? Login
</a>

</body>
</html>
