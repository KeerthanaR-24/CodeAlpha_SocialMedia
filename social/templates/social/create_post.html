<!DOCTYPE html>
<html>
<head>
    <title>Create Post</title>
</head>

<body>

<h1>Create Post</h1>

<form
    method="POST"
    enctype="multipart/form-data"
>

    {% csrf_token %}

    <textarea
        name="content"
        rows="5"
        cols="50"
        placeholder="What's on your mind?"
        required
    ></textarea>

    <br><br>

    <input
        type="file"
        name="image"
        accept="image/*"
    >

    <br><br>

    <button type="submit">
        Post
    </button>

</form>

<br>

<a href="{% url 'feed' %}">
    Back to Feed
</a>

</body>
</html>
