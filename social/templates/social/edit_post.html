<!DOCTYPE html>
<html>
<head>
    <title>Edit Post</title>
</head>

<body>

<h1>Edit Post</h1>

<form
    method="POST"
    enctype="multipart/form-data"
>

    {% csrf_token %}

    <textarea
        name="content"
        rows="5"
        cols="50"
        required
    >{{ post.content }}</textarea>

    <br><br>

    <input
        type="file"
        name="image"
        accept="image/*"
    >

    <br><br>

    <button type="submit">
        Save Changes
    </button>

</form>

<br>

<a href="{% url 'feed' %}">
    Cancel
</a>

</body>
</html>
